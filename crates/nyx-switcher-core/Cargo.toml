[package]
name = "nyx-switcher-core"
version = "0.1.0"
description = "The switcher's logic without GTK: settings, which windows to list, the switching session, shortcuts"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821", default-features = false }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "2c051e628af5582516ece1a8790882328194c26b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
