[package]
name = "nyx-switcher-core"
version = "0.1.0"
description = "The switcher's logic without GTK: settings, which windows to list, the switching session, shortcuts"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a3b8fdf1d592ed9e44531747c70dfb49d65077b8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
