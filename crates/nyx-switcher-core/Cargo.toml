[package]
name = "nyx-switcher-core"
version = "0.1.0"
description = "The switcher's logic without GTK: settings, which windows to list, the switching session, shortcuts"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411", default-features = false }
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "3f3c454cdf34cfce571a5ff3802a25817e9301f9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
