[package]
name = "nyx-switcher-backend"
version = "0.1.0"
description = "Nyx Switcher without GTK: the shortcuts' socket, the switching session, the overview's lists and thumbnails, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-switcher-backend"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gio = "0.22"
gio-unix = "0.22"
glib = "0.22"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d", features = ["capture"] }
nyx-switcher-core = { path = "../../crates/nyx-switcher-core" }
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "553f65567057150af4929033896531879528bbf4" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
serde_json = "1"
