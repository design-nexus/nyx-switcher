[package]
name = "nyx-switcher-backend"
version = "0.1.0"
description = "Nyx Switcher without GTK: the shortcuts' socket, the switching session, the overview's lists and thumbnails, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-switcher-backend"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gio = "0.22"
gio-unix = "0.22"
glib = "0.22"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68", features = ["capture"] }
nyx-switcher-core = { path = "../../crates/nyx-switcher-core" }
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6c139d893bdb01f3bd87801e08361b3b3c36591e" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
serde_json = "1"
