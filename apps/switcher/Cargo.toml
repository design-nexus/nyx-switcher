[package]
name = "nyx-switcher"
version = "0.1.0"
description = "Nyx Switcher: window and app switching for Omarchy and Hyprland"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-switcher"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gio-unix = "0.22"
glib = "0.22"
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa", features = ["capture"] }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "32f0c5e154fc44c763b8ecd80d35a3b298723afa" }
nyx-switcher-core = { path = "../../crates/nyx-switcher-core" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "4f8e16d6ae3dbc2a14091271e3b6bb29902c0df4" }
