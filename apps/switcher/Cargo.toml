[package]
name = "nyx-switcher"
version = "0.1.0"
description = "Nyx Switcher: window and app switching for Omarchy and Hyprland"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-switcher"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gio-unix = "0.22"
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821", features = ["capture"] }
nyx-switcher-core = { path = "../../crates/nyx-switcher-core" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
